aid: kiddom
name: Kiddom
description: >-
  Kiddom is a K-12 curriculum management, instruction and assessment platform used by school
  districts to implement high-quality instructional materials (HQIM), plan and pace lessons,
  deliver digital assignments, administer standards-aligned assessments, and analyze student
  performance data. The product is sold to districts rather than to developers: there is no public
  developer program, API key, or published API reference. Kiddom's public machine-readable surface
  is its 1EdTech interoperability posture — it is certified as an LTI Advantage 1.3 Tool and as a
  OneRoster 1.1 REST Data Consumer, and it rosters from Clever, ClassLink, Google Classroom, Canvas,
  Schoology and Microsoft Teams. The only publicly reachable API endpoints are the LTI 1.3 launch
  pair on api.kiddom.co; the API documentation at api.kiddom.co/docs sits behind Cloudflare Access.

apis:
- aid: kiddom:lti
  name: Kiddom LTI 1.3 Tool Endpoints
  description: >-
    Kiddom is a certified 1EdTech LTI Advantage 1.3 Tool (Assignment and Grade Services 2.0, Names
    and Role Provisioning Services 2.0, Deep Linking 2.0). The publicly reachable surface is the
    OIDC third-party-initiated login endpoint and the launch/redirect endpoint on api.kiddom.co,
    which an LMS platform (Canvas, Schoology, Google Classroom, Microsoft Teams) calls during a
    launch. Both answer an HTTP 400 JSON error to an unparameterized request, confirming they are
    live handlers rather than a catch-all. Per-district client_id, deployment_id and key-set values
    are provisioned by Kiddom support and are not published.
